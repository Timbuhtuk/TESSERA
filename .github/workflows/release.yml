name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and checks (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build, test and package desktop and CLI
        run: ./Build-Standalone.ps1 -Version "1.0.$env:GITHUB_RUN_NUMBER"
      - name: Smoke test standalone CLI
        run: |
          & ./artifacts/cli/tessera.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone CLI failed' }
      - name: Store release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            artifacts/standalone/Tessera.exe
            artifacts/Tessera-win-x64.zip
            artifacts/Tessera-cli-win-x64.zip
            artifacts/SHA256SUMS.txt

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release-files
      - name: Publish verified files and release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Gh {
              $result = & gh @args
              if ($LASTEXITCODE -ne 0) { throw "GitHub CLI failed: $args" }
              $result
          }

          # A delayed build or an old rerun must not replace the current release.
          $head = Invoke-Gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
          if ($head -ne $env:GITHUB_SHA) {
              'A newer commit is already on main; skipping this release.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
          }

          $tag = "v1.0.$env:GITHUB_RUN_NUMBER"
          $existing = & gh release view $tag --json isDraft
          if ($LASTEXITCODE -eq 0) {
              if (!(($existing | ConvertFrom-Json).isDraft)) {
                  "Release $tag is already published." >> $env:GITHUB_STEP_SUMMARY
                  exit 0
              }
          } else {
              $notes = @'
          Tessera is a standalone Windows app for preparing pixel art and icons.
          It began as a way to correct uneven grids and inconsistent pixel sizes in AI-generated pixel art.

          Change size and colors independently or together, align grids, reduce cells to single pixels and keep result histories. Create multi-size ICO files, or remove a solid background in its own workspace and save a full-size transparent PNG. Choose any library source or saved result from the From editor thumbnail panel. Background removal works globally or from connected image edges, with adjustable tolerance.

          Convert supported Aseprite animations in batches to PNG sprite sheets with JSON frame timings. All processing runs locally.

          What's new:
          - Open Presets, Size, Palette, Smoothing, Grid and Info from the editor toolbar, or from Processing on narrow windows.
          - Smooth local color noise with a separate 3x3 operation and 1-100 passes. It selects neighboring colors while preserving dimensions and alpha; its controls are independent of resizing and palette reduction.
          - Inspect image dimensions and visible color counts in Info. Click a palette color to replace it using a hue strip, color field, existing image swatch or HEX value. Replacement creates a saved result and keeps the original and transparency intact.
          - Reduce colors either by color count or by palette. Inactive settings do not affect the selected operation.
          - Keep editor settings when opening and closing tools, preserve the chosen input's aspect ratio, and apply grid operations to the selected source or result.

          The CLI includes resize, colors, aseprite, align, reduce-grid, ico and remove-background commands for scripted workflows. Use reduce-grid (also available as compact-grid) to turn uniform aligned cells into individual pixels.

          Download Tessera.exe or Tessera-win-x64.zip for the desktop app, or Tessera-cli-win-x64.zip for the CLI. No .NET installation is required. SHA256SUMS.txt contains the download checksums.

          Previously named Pixelizator. The library is now stored at %LOCALAPPDATA%\Tessera\Library. On first launch, the old Pixelizator library is copied into it and retained as a backup. The application interface currently uses Russian labels.
          '@
              Invoke-Gh release create $tag --target $env:GITHUB_SHA --title "Tessera $tag" --notes $notes --generate-notes --draft
          }

          $files = Get-ChildItem release-files -Recurse -File
          if ($files.Count -ne 4) { throw 'Expected four release assets' }
          Invoke-Gh release upload $tag @($files.FullName) --clobber
          Invoke-Gh release edit $tag --draft=false --latest
          "Published [$tag](https://github.com/$env:GH_REPO/releases/tag/$tag)." >> $env:GITHUB_STEP_SUMMARY
